name: Bug report
description: Report a problem with the wallpaper web app
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the problem and where you encountered it.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the app language and the steps that trigger the problem.
      placeholder: |-
        1. Set the app language to ...
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: State what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version or commit
      description: Use the installed version or commit SHA, without a leading v.
      placeholder: 1.2.3 or 0123456789abcdef
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and operating system
      description: Include the browser name and exact version, plus the operating system and version.
      placeholder: Firefox 131.0.3 on macOS 15.0
    validations:
      required: true
  - type: textarea
    id: visual_details
    attributes:
      label: Viewport and screenshot (optional)
      description: For visual issues, include the viewport size and attach a screenshot if available.
      render: markdown
  - type: textarea
    id: api_request
    attributes:
      label: Sanitized API request (optional)
      description: Fill this in only when the issue involves an API request. Remove tokens, cookies, and personal data.
      render: shell
