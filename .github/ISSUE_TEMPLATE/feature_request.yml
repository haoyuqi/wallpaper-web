name: Feature request
description: Suggest an improvement to the wallpaper web app
title: ""
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the need or difficulty behind the request.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: What would you like to happen?
      description: Describe the behavior that would address the problem.
    validations:
      required: true
