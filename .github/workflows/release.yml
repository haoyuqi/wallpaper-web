name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to preview (never publishes)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Validate stable tag on main
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 .github/scripts/release-notes.py validate --tag "$RELEASE_TAG"

  checks:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  notes:
    needs: [validate, checks]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.checks.result == 'success') }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Generate bilingual notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          RELEASE_NOTES_BASE_URL: ${{ secrets.RELEASE_NOTES_BASE_URL }}
          RELEASE_NOTES_MODEL: ${{ secrets.RELEASE_NOTES_MODEL }}
        run: python3 .github/scripts/release-notes.py generate --tag "$RELEASE_TAG"
      - name: Save notes for review or publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish-image:
    needs: [validate, checks, notes]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing release image
        id: existing
        run: |
          if docker buildx imagetools inspect --raw "$IMAGE_NAME:$RELEASE_TAG" > "$RUNNER_TEMP/image-inspect.json" 2> "$RUNNER_TEMP/image-inspect.err"; then
            jq -e --arg sha "${{ needs.validate.outputs.sha }}" \
              '.annotations["org.opencontainers.image.revision"] == $sha and ([.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64")) | .architecture] | unique == ["amd64", "arm64"])' \
              "$RUNNER_TEMP/image-inspect.json" || { echo 'Existing release image differs from this commit or lacks an architecture.' >&2; exit 1; }
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'not found|manifest unknown|name unknown|404' "$RUNNER_TEMP/image-inspect.err"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-inspect.err" >&2
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.exists == 'false'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          annotations: index:org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
      - name: Verify published architectures
        run: |
          docker buildx imagetools inspect --raw "$IMAGE_NAME:$RELEASE_TAG" | \
            jq -e --arg sha "${{ needs.validate.outputs.sha }}" \
              '.annotations["org.opencontainers.image.revision"] == $sha and ([.manifests[].platform | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64")) | .architecture] | unique == ["amd64", "arm64"])'

  publish:
    needs: [validate, checks, notes, publish-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; keeping its notes unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
