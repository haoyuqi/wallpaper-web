name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 19:21 UTC is 03:21 Asia/Shanghai on the following day.
    - cron: "21 19 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the declared npm version
        run: |
          npm_spec=$(node -p "require('./package.json').packageManager")
          npm install --global "$npm_spec" --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the declared npm version
        run: |
          npm_spec=$(node -p "require('./package.json').packageManager")
          npm install --global "$npm_spec" --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: Collect installed versions and test metrics
        if: ${{ always() }}
        run: node .github/scripts/ci-summary.mjs collect
      - name: Upload summary data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-data-web
          path: ci-web-metrics.json
          retention-days: 7
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  build-and-e2e:
    name: Build and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the declared npm version
        run: |
          npm_spec=$(node -p "require('./package.json').packageManager")
          npm install --global "$npm_spec" --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Build and test the production preview
        run: npm run test:e2e
      - name: Upload Playwright report and failure attachments
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Use the declared npm version
        run: |
          npm_spec=$(node -p "require('./package.json').packageManager")
          npm install --global "$npm_spec" --no-audit --no-fund
      - name: Audit locked production and development dependencies
        run: npm audit --package-lock-only --include=dev --audit-level=high --json | tee dependency-audit.json
      - name: Upload dependency audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 7
          if-no-files-found: warn

  ci:
    name: CI result
    if: ${{ always() }}
    needs: [check, unit-tests, build-and-e2e, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Download summary data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: ci-data-web
          path: ci-data
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > ci-needs.json
          node .github/scripts/ci-summary.mjs render
      - name: Require every check to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          E2E_RESULT: ${{ needs.build-and-e2e.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          echo "Check: $CHECK_RESULT"
          echo "Unit tests: $UNIT_RESULT"
          echo "Build and E2E: $E2E_RESULT"
          echo "Dependency audit: $AUDIT_RESULT"
          for result in "$CHECK_RESULT" "$UNIT_RESULT" "$E2E_RESULT" "$AUDIT_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Every required job must succeed."
              exit 1
            fi
          done

  coverage-badge:
    name: Publish coverage badge
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.unit-tests.result == 'success' }}
    needs: [unit-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-data-web
          path: ci-data
      - name: Publish measured coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-coverage-badge.py ci-data/ci-web-metrics.json
